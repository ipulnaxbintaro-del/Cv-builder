<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CV Builder iPhone</title>
<style>
:root{--ink:#17212b;--muted:#68737d;--line:#dfe4e8;--bg:#f2f4f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px calc(12px + env(safe-area-inset-top));font-weight:800;font-size:18px}
main{max-width:760px;margin:auto;padding:12px 12px 30px}.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000b}
h2{font-size:14px;margin:0 0 12px}label{display:block;font-size:11px;font-weight:700;margin:9px 0 4px}input,textarea{width:100%;padding:11px;border:1px solid #ccd4da;border-radius:9px;background:#fff;font:inherit;font-size:15px;outline:none}textarea{min-height:95px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-box{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;margin-bottom:12px}.photo-preview{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2px solid #4a78b8;background:#eef2f7;display:block}.photo-actions{flex:1}.photo-note{font-size:11px;color:var(--muted);margin-top:5px}
.item{border:1px solid var(--line);border-radius:10px;padding:11px;margin:9px 0}.itemhead{display:flex;justify-content:space-between;align-items:center;font-size:12px}.btn{border:0;border-radius:9px;padding:11px 13px;font-weight:800;font-size:13px;cursor:pointer}.add{width:100%;background:#edf1f4}.del{background:#fff0f0;color:#b42318;padding:7px 9px}.generate{width:100%;background:#17212b;color:#fff;font-size:15px;padding:14px}.secondary{background:#e9edf1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{text-align:center;font-size:11px;color:var(--muted);min-height:16px;margin-top:8px}
.preview{background:#e8ebee;padding:12px;border-radius:10px;overflow:auto}.paper{background:#fff;width:794px;min-height:1123px;margin:auto;padding:52px 58px;box-shadow:0 2px 12px #0002}.cvhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.name{font-size:25px;font-weight:800;color:#000}.cvphoto{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid #4a78b8;flex:none}.cvphoto-placeholder{width:92px;height:92px;border-radius:50%;border:2px solid #4a78b8;background:#f2f5f8;flex:none}.contact{font-size:10px;color:#444;margin-top:5px}.sec{margin-top:20px}.title{font-size:11px;font-weight:800;letter-spacing:.5px;border-bottom:1.3px solid #222;padding-bottom:5px;margin-bottom:8px}.text{font-size:10px;line-height:1.45;white-space:pre-line;text-align:justify}.job{margin-bottom:12px}.jobtop{display:flex;justify-content:space-between;gap:12px}.company{font-size:10.5px;font-weight:800}.role{font-size:10px;font-weight:700;margin-top:2px}.date{font-size:9.5px;white-space:nowrap}.skill{font-size:10px;line-height:1.45;margin-bottom:4px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.preview{margin-left:-3px;margin-right:-3px}.paper{transform-origin:top left;transform:scale(.43);margin-bottom:-635px;margin-left:0}.preview{height:500px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>CV Builder — iPhone</header>
<main>
<div class="card">
<h2>Data Pribadi</h2>
<div class="photo-box"><img id="photoPreview" class="photo-preview" alt="Foto CV"><div class="photo-actions"><label>Foto CV</label><input id="photo" type="file" accept="image/*" onchange="handlePhoto(event)"><div class="photo-note">Pilih foto dari Foto/File atau ambil dari kamera iPhone. Foto otomatis dibuat lingkaran.</div></div></div>
<label>Nama lengkap</label><input id="name" placeholder="Nama lengkap">
<div class="grid"><div><label>Kota, Provinsi</label><input id="city" placeholder="Bekasi, Jawa Barat"></div><div><label>No. HP</label><input id="phone" placeholder="08xxxxxxxxxx"></div></div>
<label>Email</label><input id="email" placeholder="nama@email.com">
<label>Ringkasan Profesional</label><textarea id="summary" placeholder="Tulis ringkasan profesional..."></textarea>
</div>

<div class="card"><h2>Pengalaman Kerja</h2><div id="jobs"></div><button class="btn add" onclick="addJob()">＋ Tambah Pengalaman</button></div>
<div class="card"><h2>Pendidikan</h2><div id="education"></div><button class="btn add" onclick="addEdu()">＋ Tambah Pendidikan</button></div>
<div class="card"><h2>Keahlian & Kompetensi</h2><textarea id="skills" placeholder="Contoh:
Kompetensi Manufaktur & Operasional: Pengoperasian Lini Produksi, Quality Control (QC), K3.
Perangkat Lunak & Administrasi: Microsoft Office.
Kompetensi Personal & Bahasa: Teamwork, Disiplin, Komunikasi."></textarea></div>

<div class="card">
<div class="actions"><button class="btn secondary" onclick="saveDraft()">Simpan Draft</button><button class="btn secondary" onclick="loadDraft()">Muat Draft</button></div>
<button class="btn generate" style="margin-top:8px" onclick="generatePDF()">⬇️ Generate & Download PDF</button>
<div id="status" class="status"></div>
</div>

<div class="card"><h2>Preview CV</h2><div class="preview"><div class="paper" id="paper"></div></div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);let jobs=[],education=[],photoData="";
function handlePhoto(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;$("photoPreview").src=photoData;render()};r.readAsDataURL(f)}
function circleImage(dataUrl,size=600){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=size;c.height=size;const ctx=c.getContext("2d");ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;ctx.drawImage(img,sx,sy,m,m,0,0,size,size);resolve(c.toDataURL("image/jpeg",.92))};img.onerror=reject;img.src=dataUrl})}
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function addJob(v={}){jobs.push(v);editors();render()}function addEdu(v={}){education.push(v);editors();render()}
function delJob(i){jobs.splice(i,1);editors();render()}function delEdu(i){education.splice(i,1);editors();render()}
function editors(){
$("jobs").innerHTML=jobs.map((j,i)=>`<div class="item"><div class="itemhead"><b>Pengalaman ${i+1}</b><button class="btn del" onclick="delJob(${i})">Hapus</button></div>
<label>Perusahaan</label><input value="${esc(j.company)}" oninput="jobs[${i}].company=this.value;render()">
<div class="grid"><div><label>Periode</label><input value="${esc(j.date)}" oninput="jobs[${i}].date=this.value;render()"></div><div><label>Posisi</label><input value="${esc(j.role)}" oninput="jobs[${i}].role=this.value;render()"></div></div>
<label>Deskripsi pekerjaan</label><textarea oninput="jobs[${i}].desc=this.value;render()">${esc(j.desc)}</textarea></div>`).join("");
$("education").innerHTML=education.map((e,i)=>`<div class="item"><div class="itemhead"><b>Pendidikan ${i+1}</b><button class="btn del" onclick="delEdu(${i})">Hapus</button></div>
<label>Institusi</label><input value="${esc(e.school)}" oninput="education[${i}].school=this.value;render()">
<div class="grid"><div><label>Periode</label><input value="${esc(e.date)}" oninput="education[${i}].date=this.value;render()"></div><div><label>Jurusan</label><input value="${esc(e.major)}" oninput="education[${i}].major=this.value;render()"></div></div>
<label>Keterangan</label><textarea oninput="education[${i}].note=this.value;render()">${esc(e.note)}</textarea></div>`).join("");
}
function render(){
let j=jobs.filter(x=>x.company||x.role||x.desc).map(x=>`<div class="job"><div class="jobtop"><div><div class="company">${esc(x.company)}</div><div class="role">${esc(x.role)}</div></div><div class="date">${esc(x.date)}</div></div><div class="text">${esc(x.desc)}</div></div>`).join("");
let e=education.filter(x=>x.school||x.major||x.note).map(x=>`<div class="job"><div class="jobtop"><div><div class="company">${esc(x.school)}</div><div class="role">${esc(x.major)}</div></div><div class="date">${esc(x.date)}</div></div><div class="text">${esc(x.note)}</div></div>`).join("");
let s=esc($("skills").value).split("\n").filter(Boolean).map(x=>`<div class="skill">${x}</div>`).join("");
$("paper").innerHTML=`<div class="cvhead"><div><div class="name">${esc($("name").value)||"NAMA LENGKAP"}</div><div class="contact">${esc($("city").value)}${$("city").value?" | ":""}${esc($("phone").value)}${$("phone").value?" | ":""}${esc($("email").value)}</div></div>${photoData?`<img class="cvphoto" src="${photoData}" alt="Foto">`:`<div class="cvphoto-placeholder"></div>`}</div>
<div class="sec"><div class="title">RINGKASAN PROFESIONAL</div><div class="text">${esc($("summary").value)}</div></div>
<div class="sec"><div class="title">PENGALAMAN KERJA</div>${j||'<div class="text">Belum ada pengalaman.</div>'}</div>
<div class="sec"><div class="title">PENDIDIKAN</div>${e||'<div class="text">Belum ada pendidikan.</div>'}</div>
<div class="sec"><div class="title">KEAHLIAN & KOMPETENSI</div>${s||'<div class="text">Belum ada keahlian.</div>'}</div>`;
}
function payload(){return {photoData,name:$("name").value,city:$("city").value,phone:$("phone").value,email:$("email").value,summary:$("summary").value,skills:$("skills").value,jobs,education}}
function saveDraft(){localStorage.cvIphone=JSON.stringify(payload());$("status").textContent="Draft tersimpan di iPhone."}
function loadDraft(){let x=localStorage.cvIphone;if(!x){$("status").textContent="Belum ada draft.";return}let d=JSON.parse(x);["name","city","phone","email","summary","skills"].forEach(k=>$(k).value=d[k]||"");jobs=d.jobs||[];education=d.education||[];photoData=d.photoData||"";$("photoPreview").src=photoData||"";editors();render();$("status").textContent="Draft dimuat."}
function line(doc,text,x,y,maxWidth,size=9,leading=4.2){doc.setFontSize(size);let lines=doc.splitTextToSize(text||"",maxWidth);doc.text(lines,x,y);return y+lines.length*leading}
function section(doc,title,y){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(title,15,y);doc.setLineWidth(.3);doc.line(15,y+2,195,y+2);return y+8}
async function generatePDF(){
const status=$("status");status.textContent="Membuat PDF...";
if(!window.jspdf){status.textContent="Generator PDF belum termuat. Pastikan iPhone terhubung internet, lalu coba lagi.";return}
try{
const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
let y=18, left=15, width=180;
if(photoData){try{const circular=await circleImage(photoData);doc.addImage(circular,"JPEG",165,12,30,30);doc.setDrawColor(74,120,184);doc.setLineWidth(.5);doc.circle(180,27,15)}catch(e){}}
doc.setFont("helvetica","bold");doc.setTextColor(0,0,0);doc.setFontSize(18);doc.text($("name").value||"NAMA LENGKAP",left,y);y+=5;
doc.setFont("helvetica","normal");doc.setFontSize(8);let c=[$("city").value,$("phone").value,$("email").value].filter(Boolean).join(" | ");doc.text(c,left,y);y+=8;
y=section(doc,"RINGKASAN PROFESIONAL",y);y=line(doc,$("summary").value,left,y,width,8.5,4.1)+3;
y=section(doc,"PENGALAMAN KERJA",y);
for(const j of jobs){if(!(j.company||j.role||j.desc))continue;doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text(j.company||"",left,y);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text(j.date||"",195,y,{align:"right"});y+=4;doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text(j.role||"",left,y);y+=4;y=line(doc,j.desc,left,y,width,8,4)+3;if(y>278){doc.addPage();y=18}}
y=section(doc,"PENDIDIKAN",y);
for(const e of education){if(!(e.school||e.major||e.note))continue;doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text(e.school||"",left,y);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text(e.date||"",195,y,{align:"right"});y+=4;doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text(e.major||"",left,y);y+=4;y=line(doc,e.note,left,y,width,8,4)+3;if(y>278){doc.addPage();y=18}}
y=section(doc,"KEAHLIAN & KOMPETENSI",y);
for(const s of $("skills").value.split("\n")){if(s.trim()){y=line(doc,s,left,y,width,8,4)+1;if(y>278){doc.addPage();y=18}}}
const filename=(($("name").value||"CV").trim().replace(/[^A-Za-z0-9_-]+/g,"_")||"CV")+"_CV.pdf";
doc.save(filename);status.textContent="PDF berhasil dibuat. Cek folder Download / File di iPhone.";
}catch(e){status.textContent="Gagal membuat PDF: "+e.message}}
document.querySelectorAll("input,textarea").forEach(x=>x.addEventListener("input",render));addJob();addEdu();render();
</script>
</body></html>
