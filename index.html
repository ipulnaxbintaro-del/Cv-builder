<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>CV Builder — Luthfiah ATS Style</title>
<style>
:root{--navy:#173f73;--ink:#111;--muted:#333;--line:#173f73;--bg:#f2f4f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe4e8;padding:14px 16px;font-size:18px;font-weight:800}
main{max-width:920px;margin:auto;padding:12px 12px 50px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000b}
h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:11px;font-weight:700;margin:9px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid #ccd4da;border-radius:9px;background:#fff;font:inherit;font-size:15px}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:9px;padding:12px 13px;font-weight:800;font-size:14px;cursor:pointer;-webkit-appearance:none}
.add{width:100%;background:#edf1f4}.del{background:#fff0f0;color:#b42318;padding:8px 10px}
.generate{width:100%;background:#111827;color:#fff;font-size:16px;padding:14px}
.secondary{background:#e9edf1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{text-align:center;font-size:11px;color:#68737d;min-height:20px;margin-top:8px}
.photo-row{display:flex;gap:12px;align-items:center}
.photo-preview{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--navy);display:none}
.item{border:1px solid #dfe4e8;border-radius:10px;padding:11px;margin:9px 0}
.itemhead{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.preview-wrap{background:#e8ebee;padding:14px;border-radius:10px;overflow:auto;-webkit-overflow-scrolling:touch}
.paper{background:#fff;width:794px;min-height:1123px;margin:auto;padding:37px 43px 33px;box-shadow:0 2px 12px #0002;font-family:Arial,sans-serif}
.cv-header{display:flex;align-items:center;gap:18px;margin-bottom:7px}
.cv-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--navy);flex:0 0 80px}
.cv-head-info{flex:1;min-width:0}
.name{font-family:Arial,sans-serif;font-size:27px;line-height:1.05;font-weight:700;color:#000;margin:0;text-transform:uppercase;letter-spacing:0}
.contact{font-family:Arial,sans-serif;font-size:10.5px;color:#111;margin-top:4px;line-height:1.25;font-weight:700}
.email{color:var(--navy)}
.sec{margin-top:6px}
.title{font-family:Arial,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.15px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:3px;margin-bottom:4px;text-transform:uppercase}
.text{font-family:Arial,sans-serif;font-size:10px;line-height:1.26;white-space:pre-line;text-align:justify}
.job{margin-bottom:5px}
.jobtop{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.company{font-family:Arial,sans-serif;font-size:10.5px;font-weight:700;line-height:1.16}
.role{font-family:Arial,sans-serif;font-size:10px;font-style:italic;color:#222;margin-top:1px;line-height:1.18}
.date{font-family:Arial,sans-serif;font-size:10.5px;font-weight:700;white-space:nowrap;text-align:right}
.bullets{margin:2px 0 0 16px;padding:0}
.bullets li{font-family:Arial,sans-serif;font-size:10px;line-height:1.24;margin:1px 0;padding-left:2px;text-align:justify}
.edu-note{margin-top:1px}
.skill{font-family:Arial,sans-serif;font-size:10px;line-height:1.26;margin-bottom:1px}
.skill b{font-weight:700}
@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .preview-wrap{height:560px}
 .paper{transform-origin:top left;transform:scale(.43);margin-left:0;margin-right:0;margin-bottom:-630px}
 .actions{grid-template-columns:1fr}
 .photo-row{align-items:flex-start}
}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff!important;margin:0!important;padding:0!important}
 header,.form-area,.toolbar,.preview-title{display:none!important}
 main{display:block!important;margin:0!important;padding:0!important;max-width:none!important}
 .preview-card{display:block!important;margin:0!important;padding:0!important;box-shadow:none!important;border-radius:0!important}
 .preview-wrap{display:block!important;padding:0!important;margin:0!important;overflow:visible!important;background:#fff!important;height:auto!important}
 .paper{display:block!important;width:210mm!important;min-height:297mm!important;margin:0!important;padding:10mm 11mm 9mm!important;box-shadow:none!important;transform:none!important}
}
</style>
</head>
<body>
<header>CV Builder — iPhone</header>
<main>
<section class="card form-area">
<h2>Data Pribadi</h2>
<label>Nama lengkap</label><input id="name" placeholder="Nama lengkap">
<div class="grid">
<div><label>Kota, Provinsi</label><input id="city" placeholder="Bekasi, Jawa Barat"></div>
<div><label>No. HP</label><input id="phone" placeholder="08xxxxxxxxxx"></div>
</div>
<label>Email</label><input id="email" placeholder="nama@email.com">
<label>Foto profil</label>
<div class="photo-row"><img id="photoPreview" class="photo-preview" alt="Foto"><div style="flex:1"><input id="photo" type="file" accept="image/*"><div style="font-size:10px;color:#7b858e;margin-top:4px">Foto otomatis dibuat lingkaran.</div></div></div>
<label>Ringkasan Profesional</label><textarea id="summary" placeholder="Tulis ringkasan profesional..."></textarea>
</section>

<section class="card form-area">
<h2>Pengalaman Kerja</h2>
<div id="jobs"></div>
<button type="button" class="btn add" id="addJob">＋ Tambah Pengalaman</button>
</section>

<section class="card form-area">
<h2>Pendidikan</h2>
<div id="education"></div>
<button type="button" class="btn add" id="addEdu">＋ Tambah Pendidikan</button>
</section>

<section class="card form-area">
<h2>Keahlian & Kompetensi</h2>
<textarea id="skills" placeholder="Kompetensi Manufaktur & Operasional: Pengoperasian Lini Produksi, Quality Control (QC), K3."></textarea>
</section>

<section class="card toolbar form-area">
<div class="actions">
<button type="button" class="btn secondary" id="save">Simpan Draft</button>
<button type="button" class="btn secondary" id="load">Muat Draft</button>
</div>
<button type="button" class="btn generate" id="pdf" style="margin-top:8px">⬇️ Buat PDF</button>
<div id="status" class="status"></div>
</section>

<section class="card preview-card">
<h2 class="preview-title">Preview CV</h2>
<div class="preview-wrap"><div class="paper" id="paper"></div></div>
</section>
</main>

<script>
(function(){
"use strict";
var jobs=[], education=[], photoData="";
function $(id){return document.getElementById(id)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})}
function shortMonthDate(s){
 var map={januari:"jan",februari:"feb",maret:"mar",april:"apr",mei:"mei",juni:"jun",juli:"jul",agustus:"agt",september:"sept",oktober:"okt",november:"nov",desember:"des"};
 return String(s||"").replace(/januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember/gi,function(m){return map[m.toLowerCase()]||m});
}
function renderEditors(){
 var jbox=$("jobs");
 jbox.innerHTML="";
 jobs.forEach(function(j,i){
  var div=document.createElement("div"); div.className="item";
  div.innerHTML='<div class="itemhead"><b>Pengalaman '+(i+1)+'</b><button type="button" class="btn del" data-job="'+i+'">Hapus</button></div>'+
  '<label>Perusahaan</label><input data-jfield="company" data-i="'+i+'">'+
  '<div class="grid"><div><label>Periode</label><input data-jfield="date" data-i="'+i+'"></div><div><label>Posisi</label><input data-jfield="role" data-i="'+i+'"></div></div>'+
  '<label>Deskripsi pekerjaan</label><textarea data-jfield="desc" data-i="'+i+'"></textarea>';
  jbox.appendChild(div);
  div.querySelector('[data-jfield="company"]').value=j.company||"";
  div.querySelector('[data-jfield="date"]').value=j.date||"";
  div.querySelector('[data-jfield="role"]').value=j.role||"";
  div.querySelector('[data-jfield="desc"]').value=j.desc||"";
 });
 var ebox=$("education"); ebox.innerHTML="";
 education.forEach(function(e,i){
  var div=document.createElement("div"); div.className="item";
  div.innerHTML='<div class="itemhead"><b>Pendidikan '+(i+1)+'</b><button type="button" class="btn del" data-edu="'+i+'">Hapus</button></div>'+
  '<label>Institusi</label><input data-efield="school" data-i="'+i+'">'+
  '<div class="grid"><div><label>Periode</label><input data-efield="date" data-i="'+i+'"></div><div><label>Jurusan</label><input data-efield="major" data-i="'+i+'"></div></div>'+
  '<label>Keterangan</label><textarea data-efield="note" data-i="'+i+'"></textarea>';
  ebox.appendChild(div);
  div.querySelector('[data-efield="school"]').value=e.school||"";
  div.querySelector('[data-efield="date"]').value=e.date||"";
  div.querySelector('[data-efield="major"]').value=e.major||"";
  div.querySelector('[data-efield="note"]').value=e.note||"";
 });
}
function addJob(){jobs.push({company:"",date:"",role:"",desc:""});renderEditors();render();$("jobs").lastElementChild.scrollIntoView({behavior:"smooth",block:"center"})}
function addEdu(){education.push({school:"",date:"",major:"",note:""});renderEditors();render();$("education").lastElementChild.scrollIntoView({behavior:"smooth",block:"center"})}
function render(){
 var j=jobs.filter(function(x){return x.company||x.role||x.desc}).map(function(x){
  var bullets=String(x.desc||"").split(/\n+/).map(function(s){return s.trim()}).filter(Boolean)
    .map(function(s){return "<li>"+esc(s.replace(/^[-•]\s*/,""))+"</li>"}).join("");
  return '<div class="job"><div class="jobtop"><div><div class="company">'+esc(x.company)+'</div><div class="role">'+esc(x.role)+'</div></div><div class="date">'+esc(shortMonthDate(x.date))+'</div></div>'+(bullets?'<ul class="bullets">'+bullets+'</ul>':'')+'</div>';
 }).join("");

 var e=education.filter(function(x){return x.school||x.major||x.note}).map(function(x){
  var notes=String(x.note||"").split(/\n+/).map(function(s){return s.trim()}).filter(Boolean)
    .map(function(s){return "<li>"+esc(s.replace(/^[-•]\s*/,""))+"</li>"}).join("");
  return '<div class="job"><div class="jobtop"><div><div class="company">'+esc(x.school)+'</div><div class="role">'+esc(x.major)+'</div></div><div class="date">'+esc(shortMonthDate(x.date))+'</div></div>'+(notes?'<ul class="bullets">'+notes+'</ul>':'')+'</div>';
 }).join("");

 var photo=photoData
   ? '<img class="cv-photo" src="'+photoData+'" alt="Foto profil">'
   : '<div class="cv-photo" style="display:flex;align-items:center;justify-content:center;font-size:8px;color:#7b858e;text-align:center">FOTO</div>';

 $("paper").innerHTML=
   '<div class="cv-header">'+photo+
     '<div class="cv-head-info">'+
       '<div class="name">'+(esc($("name").value)||"NAMA LENGKAP")+'</div>'+
       '<div class="contact">'+esc($("city").value)+($("city").value?" | ":"")+esc($("phone").value)+($("phone").value?" | ":"")+'<span class="email">'+esc($("email").value)+'</span></div>'+
     '</div>'+
   '</div>'+
   '<div class="sec"><div class="title">RINGKASAN PROFESIONAL</div><div class="text">'+(esc($("summary").value)||"Belum ada ringkasan.")+'</div></div>'+
   '<div class="sec"><div class="title">PENGALAMAN KERJA</div>'+(j||'<div class="text">Belum ada pengalaman.</div>')+'</div>'+
   '<div class="sec"><div class="title">PENDIDIKAN</div>'+(e||'<div class="text">Belum ada pendidikan.</div>')+'</div>'+
   '<div class="sec"><div class="title">KEAHLIAN & KOMPETENSI</div>'+skillHTML($("skills").value)+'</div>';
}
function skillHTML(raw){return esc(raw).split("\n").filter(Boolean).map(function(x){var p=x.indexOf(":");return p>0?'<div class="skill"><b>'+x.slice(0,p+1)+'</b>'+x.slice(p+1)+'</div>':'<div class="skill">'+x+'</div>'}).join("")}
function payload(){return {name:$("name").value,city:$("city").value,phone:$("phone").value,email:$("email").value,summary:$("summary").value,skills:$("skills").value,jobs:jobs,education:education,photoData:photoData}}
function saveDraft(){try{localStorage.setItem("cvBuilderFinal",JSON.stringify(payload()));$("status").textContent="Draft tersimpan."}catch(e){$("status").textContent="Draft gagal disimpan. Foto mungkin terlalu besar."}}
function loadDraft(){try{var d=JSON.parse(localStorage.getItem("cvBuilderFinal")||"null");if(!d){$("status").textContent="Belum ada draft.";return}["name","city","phone","email","summary","skills"].forEach(function(k){$(k).value=d[k]||""});jobs=Array.isArray(d.jobs)?d.jobs:[];education=Array.isArray(d.education)?d.education:[];photoData=d.photoData||"";if(photoData){$("photoPreview").src=photoData;$("photoPreview").style.display="block"}renderEditors();render();$("status").textContent="Draft dimuat."}catch(e){$("status").textContent="Draft tidak dapat dimuat."}}
function wrapCanvasText(ctx,text,maxWidth){
 var out=[], paras=String(text||'').split(/\n+/);
 paras.forEach(function(par){var words=par.trim().split(/\s+/).filter(Boolean);if(!words.length){out.push('');return}var line='';words.forEach(function(w){var test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=w}else line=test});if(line)out.push(line)});return out;
}
function canvasPdfBytes(jpegData,w,h){
 var b64=jpegData.split(',')[1],bin=atob(b64),img=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
 var enc=new TextEncoder(),parts=[],offsets=[0],total=0;function add(a){parts.push(a);total+=a.length}function txt(s){add(enc.encode(s))}function obj(n,body){offsets[n]=total;txt(n+' 0 obj\n');if(body instanceof Uint8Array)add(body);else txt(body);txt('\nendobj\n')}
 txt('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
 var content='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';obj(4,'<< /Length '+enc.encode(content).length+' >>\nstream\n'+content+'endstream');offsets[5]=total;txt('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n');add(img);txt('\nendstream\nendobj\n');var xref=total;txt('xref\n0 6\n0000000000 65535 f \n');for(var n=1;n<=5;n++)txt(String(offsets[n]).padStart(10,'0')+' 00000 n \n');txt('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');var all=new Uint8Array(total),pos=0;parts.forEach(function(a){all.set(a,pos);pos+=a.length});return all;
}
function drawCvToCanvas(done){
 var scale=2,W=794*scale,H=1123*scale,c=document.createElement('canvas');c.width=W;c.height=H;var ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,794,1123);var blue='#173f73',x=43,y=34,photoSize=100;
 function setFont(size,weight){ctx.font=(weight||'400')+' '+size+'px Arial,Helvetica,sans-serif'}function drawText(t,xx,yy,size,weight,color){setFont(size,weight);ctx.fillStyle=color||'#111';ctx.fillText(t,xx,yy)}function wrap(t,xx,yy,size,weight,color,maxWidth,lineH){setFont(size,weight);ctx.fillStyle=color||'#111';wrapCanvasText(ctx,t,maxWidth).forEach(function(l){ctx.fillText(l,xx,yy);yy+=lineH});return yy}
 if(photoData){var im=new Image();im.onload=function(){drawRest(im)};im.onerror=function(){drawRest(null)};im.src=photoData}else drawRest(null);
 function drawRest(im){
  if(im){ctx.save();ctx.beginPath();ctx.arc(x+50,y+50,50,0,Math.PI*2);ctx.clip();ctx.drawImage(im,x,y,100,100);ctx.restore();ctx.strokeStyle=blue;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+50,y+50,49,0,Math.PI*2);ctx.stroke()}else{ctx.strokeStyle=blue;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+50,y+50,49,0,Math.PI*2);ctx.stroke();drawText('FOTO',x+34,y+55,9,'700','#7b858e')}
  var tx=x+120,contact=$('city').value+($('city').value?' | ':'')+$('phone').value+($('phone').value?' | ':'');drawText(($('name').value||'NAMA LENGKAP').toUpperCase(),tx,y+44,37.33,'700','#000');setFont(14,'700');ctx.fillStyle='#111';ctx.fillText(contact,tx,y+67);ctx.fillStyle=blue;ctx.fillText($('email').value,tx+ctx.measureText(contact).width,y+67);
  y=145;ctx.strokeStyle=blue;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(751,y);ctx.stroke();function section(t){y+=22;drawText(t,x,y,18.67,'700',blue);y+=7;ctx.strokeStyle=blue;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(751,y);ctx.stroke();y+=22}
  section('RINGKASAN PROFESIONAL');y=wrap($('summary').value||'Belum ada ringkasan.',x,y,16,'400','#111',708,20)+8;section('PENGALAMAN KERJA');var used=false;jobs.filter(function(a){return a.company||a.role||a.desc}).forEach(function(j){used=true;drawText(j.company,x,y,16,'700','#111');drawText(shortMonthDate(j.date),600,y,15,'700','#111');y+=18;drawText(j.role,x,y,15,'400','#111');y+=19;String(j.desc||'').split(/\n+/).map(function(s){return s.trim()}).filter(Boolean).forEach(function(b){drawText('•',x+3,y,16,'400','#111');y=wrap(b.replace(/^[-•]\s*/,''),x+17,y,16,'400','#111',690,20)+2});y+=4});if(!used)y=wrap('Belum ada pengalaman.',x,y,16,'400','#111',708,20)+8;
  section('PENDIDIKAN');var eu=false;education.filter(function(a){return a.school||a.major||a.note}).forEach(function(e){eu=true;drawText(e.school,x,y,16,'700','#111');drawText(shortMonthDate(e.date),600,y,15,'700','#111');y+=18;drawText(e.major,x,y,15,'400','#111');y+=19;String(e.note||'').split(/\n+/).map(function(s){return s.trim()}).filter(Boolean).forEach(function(b){drawText('•',x+3,y,16,'400','#111');y=wrap(b.replace(/^[-•]\s*/,''),x+17,y,16,'400','#111',690,20)+2});y+=4});if(!eu)y=wrap('Belum ada pendidikan.',x,y,16,'400','#111',708,20)+8;
  section('KEAHLIAN & KOMPETENSI');var skills=String($('skills').value||'').split(/\n+/).filter(Boolean);if(!skills.length)y=wrap('Belum ada keahlian.',x,y,16,'400','#111',708,20);else skills.forEach(function(s){var p=s.indexOf(':');if(p>0){drawText(s.slice(0,p+1),x,y,16,'700','#111');y=wrap(s.slice(p+1).trim(),x+115,y,16,'400','#111',593,20)}else y=wrap(s,x,y,16,'400','#111',708,20);y+=3});done(c)
 }
}
function generatePDF(){
 var popup=window.open('about:blank','_blank');$('status').textContent='Membuat PDF tanpa URL dan nomor halaman…';drawCvToCanvas(function(canvas){try{var jpeg=canvas.toDataURL('image/jpeg',.94),pdf=canvasPdfBytes(jpeg,canvas.width,canvas.height),blob=new Blob([pdf],{type:'application/pdf'}),url=URL.createObjectURL(blob);if(popup)popup.location.href=url;else{var a=document.createElement('a');a.href=url;a.download=(($('name').value||'CV').replace(/[^a-z0-9 _-]/gi,'').trim()||'CV')+'.pdf';document.body.appendChild(a);a.click();a.remove()}$('status').textContent='PDF dibuat tanpa tulisan URL GitHub dan tanpa nomor halaman. Tekan Share → Save to Files.';setTimeout(function(){URL.revokeObjectURL(url)},60000)}catch(e){if(popup)popup.close();$('status').textContent='PDF gagal dibuat: '+e.message}})
}
["name","city","phone","email","summary","skills"].forEach(function(id){$(id).addEventListener("input",render)});
$("addJob").addEventListener("click",addJob);
$("addEdu").addEventListener("click",addEdu);
$("save").addEventListener("click",saveDraft);
$("load").addEventListener("click",loadDraft);
$("pdf").addEventListener("click",generatePDF);
$("jobs").addEventListener("input",function(e){var i=e.target.getAttribute("data-i"),f=e.target.getAttribute("data-jfield");if(i!==null&&f){jobs[+i][f]=e.target.value;render()}});
$("jobs").addEventListener("click",function(e){var i=e.target.getAttribute("data-job");if(i!==null){jobs.splice(+i,1);renderEditors();render()}});
$("education").addEventListener("input",function(e){var i=e.target.getAttribute("data-i"),f=e.target.getAttribute("data-efield");if(i!==null&&f){education[+i][f]=e.target.value;render()}});
$("education").addEventListener("click",function(e){var i=e.target.getAttribute("data-edu");if(i!==null){education.splice(+i,1);renderEditors();render()}});
$("photo").addEventListener("change",function(e){
 var f=e.target.files&&e.target.files[0]; if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  var img=new Image();
  img.onload=function(){
   var max=900,scale=Math.min(1,max/Math.max(img.width,img.height));
   var c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
   var ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);
   photoData=c.toDataURL("image/jpeg",.86);
   $("photoPreview").src=photoData;$("photoPreview").style.display="block";render();
  };
  img.src=r.result;
 };
 r.readAsDataURL(f);
});
renderEditors();render();
})();
</script>
</body>
</html>
