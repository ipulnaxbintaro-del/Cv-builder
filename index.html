<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>CV Builder iPhone</title>
<style>
:root{--ink:#111827;--blue:#2f6fed;--muted:#68737d;--line:#dfe4e8;--bg:#f2f4f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px calc(12px + env(safe-area-inset-top));font-weight:800;font-size:18px}
main{max-width:760px;margin:auto;padding:12px 12px 40px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000b}
h2{font-size:14px;margin:0 0 12px}label{display:block;font-size:11px;font-weight:700;margin:9px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid #ccd4da;border-radius:9px;background:#fff;font:inherit;font-size:15px;outline:none}textarea{min-height:95px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:11px;margin:9px 0}.itemhead{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.btn{border:0;border-radius:9px;padding:11px 13px;font-weight:800;font-size:13px;cursor:pointer}.add{width:100%;background:#edf1f4}.del{background:#fff0f0;color:#b42318;padding:7px 9px}.generate{width:100%;background:#111827;color:#fff;font-size:15px;padding:14px}.secondary{background:#e9edf1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{text-align:center;font-size:11px;color:var(--muted);min-height:32px;margin-top:8px;line-height:1.45}
.photo-row{display:flex;gap:12px;align-items:center}.photo-preview{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);display:none;background:#eef3ff}.photo-help{font-size:10px;color:#7b858e;line-height:1.4}
.preview{background:#e8ebee;padding:12px;border-radius:10px;overflow:auto}.paper{background:#fff;width:794px;min-height:1123px;margin:auto;padding:45px 55px;box-shadow:0 2px 12px #0002}
.cv-header{display:flex;align-items:center;gap:20px;padding-bottom:14px;border-bottom:1.5px solid var(--blue)}
.cv-photo{width:105px;height:105px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);flex:0 0 105px;background:#eef3ff;display:none}.cv-photo.placeholder{display:flex;align-items:center;justify-content:center;font-size:8px;color:#8a96a3;text-align:center}
.cv-head-info{min-width:0;flex:1}.name{font-size:27px;line-height:1.05;font-weight:800;color:#111;margin:0;letter-spacing:.1px}.headline{font-size:12px;font-weight:700;color:var(--blue);margin-top:6px}.contact{font-size:10px;color:#444;margin-top:7px;line-height:1.5}.email{color:var(--blue)}
.sec{margin-top:17px}.title{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--blue);border-bottom:1.5px solid var(--blue);padding-bottom:5px;margin-bottom:8px}.text{font-size:10px;line-height:1.45;white-space:pre-line;text-align:justify}.job{margin-bottom:12px;position:relative;padding-left:14px;border-left:2px solid #dbe7ff}.job:before{content:"";position:absolute;left:-5px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--blue)}.jobtop{display:flex;justify-content:space-between;gap:12px}.company{font-size:10.5px;font-weight:800}.role{font-size:10px;font-weight:700;color:var(--blue);margin-top:2px}.date{font-size:9.5px;white-space:nowrap}.skill{font-size:10px;line-height:1.45;margin-bottom:4px}.skill b{font-weight:800}
@media(max-width:600px){
.grid{grid-template-columns:1fr}
.preview{margin-left:-3px;margin-right:-3px;height:560px;overflow:auto;background:#e8ebee}
.paper{transform-origin:top left;transform:scale(.43);margin:0 0 -635px 0}
.actions{grid-template-columns:1fr}
.photo-row{align-items:flex-start}
}
@media print{
@page{size:A4;margin:0}
html,body{background:#fff!important;margin:0!important;padding:0!important}
header,main>.card:not(:last-child),main>.card:last-child>h2,main>.card:last-child>.actions,main>.card:last-child>.generate,main>.card:last-child>.status{display:none!important}
main{display:block!important;max-width:none!important;margin:0!important;padding:0!important}
main>.card:last-child{display:block!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important}
.preview{display:block!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important;height:auto!important}
.paper{display:block!important;width:210mm!important;min-height:297mm!important;margin:0!important;padding:14mm 15mm!important;box-shadow:none!important;transform:none!important}
}</style>
</head>
<body>
<header>CV Builder — iPhone</header>
<main>
<div class="card">
<h2>Data Pribadi</h2>
<label>Nama lengkap</label><input id="name" placeholder="Nama lengkap">
<label>Posisi / Headline CV</label><input id="headline" placeholder="Contoh: Freshgraduate / Operator Produksi">
<div class="grid"><div><label>Kota, Provinsi</label><input id="city" placeholder="Bekasi, Jawa Barat"></div><div><label>No. HP</label><input id="phone" placeholder="08xxxxxxxxxx"></div></div>
<label>Email</label><input id="email" placeholder="nama@email.com">
<label>Foto profil</label>
<div class="photo-row"><img id="photoPreview" class="photo-preview"><div style="flex:1"><input id="photo" type="file" accept="image/*"><div class="photo-help">Foto otomatis dipotong menjadi lingkaran. Pilih foto dari iPhone.</div></div></div>
<label>Ringkasan Profesional</label><textarea id="summary" placeholder="Tulis ringkasan profesional..."></textarea>
</div>

<div class="card"><h2>Pengalaman Kerja</h2><div id="jobs"></div><button class="btn add" onclick="addJob()">＋ Tambah Pengalaman</button></div>
<div class="card"><h2>Pendidikan</h2><div id="education"></div><button class="btn add" onclick="addEdu()">＋ Tambah Pendidikan</button></div>
<div class="card"><h2>Keahlian & Kompetensi</h2><textarea id="skills" placeholder="Kompetensi Manufaktur & Operasional: Pengoperasian Lini Produksi, Quality Control (QC), K3.\nPerangkat Lunak & Administrasi: Microsoft Office.\nKompetensi Personal & Bahasa: Teamwork, Disiplin, Komunikasi."></textarea></div>

<div class="card">
<div class="actions"><button class="btn secondary" onclick="saveDraft()">Simpan Draft</button><button class="btn secondary" onclick="loadDraft()">Muat Draft</button></div>
<button class="btn generate" style="margin-top:8px" onclick="generatePDF()">⬇️ Buat PDF</button>
<div id="status" class="status"></div>
</div>

<div class="card"><h2>Preview CV</h2><div class="preview"><div class="paper" id="paper"></div></div></div>
</main>

<script>
const $=id=>document.getElementById(id);let jobs=[],education=[],photoData="";
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function addJob(v={}){jobs.push(v);editors();render()}function addEdu(v={}){education.push(v);editors();render()}
function delJob(i){jobs.splice(i,1);editors();render()}function delEdu(i){education.splice(i,1);render()}
function editors(){
$("jobs").innerHTML=jobs.map((j,i)=>`<div class="item"><div class="itemhead"><b>Pengalaman ${i+1}</b><button class="btn del" onclick="delJob(${i})">Hapus</button></div>
<label>Perusahaan</label><input value="${esc(j.company)}" oninput="jobs[${i}].company=this.value;render()">
<div class="grid"><div><label>Periode</label><input value="${esc(j.date)}" oninput="jobs[${i}].date=this.value;render()"></div><div><label>Posisi</label><input value="${esc(j.role)}" oninput="jobs[${i}].role=this.value;render()"></div></div>
<label>Deskripsi pekerjaan</label><textarea oninput="jobs[${i}].desc=this.value;render()">${esc(j.desc)}</textarea></div>`).join("");
$("education").innerHTML=education.map((e,i)=>`<div class="item"><div class="itemhead"><b>Pendidikan ${i+1}</b><button class="btn del" onclick="delEdu(${i})">Hapus</button></div>
<label>Institusi</label><input value="${esc(e.school)}" oninput="education[${i}].school=this.value;render()">
<div class="grid"><div><label>Periode</label><input value="${esc(e.date)}" oninput="education[${i}].date=this.value;render()"></div><div><label>Jurusan</label><input value="${esc(e.major)}" oninput="education[${i}].major=this.value;render()"></div></div>
<label>Keterangan</label><textarea oninput="education[${i}].note=this.value;render()">${esc(e.note)}</textarea></div>`).join("");
}
function skillHTML(raw){return esc(raw).split("\n").filter(Boolean).map(x=>{let p=x.indexOf(":");return p>0?`<div class="skill"><b>${x.slice(0,p+1)}</b>${x.slice(p+1)}</div>`:`<div class="skill">${x}</div>`}).join("")}
function render(){
let j=jobs.filter(x=>x.company||x.role||x.desc).map(x=>`<div class="job"><div class="jobtop"><div><div class="company">${esc(x.company)}</div><div class="role">${esc(x.role)}</div></div><div class="date">${esc(x.date)}</div></div><div class="text">${esc(x.desc)}</div></div>`).join("");
let e=education.filter(x=>x.school||x.major||x.note).map(x=>`<div class="job"><div class="jobtop"><div><div class="company">${esc(x.school)}</div><div class="role">${esc(x.major)}</div></div><div class="date">${esc(x.date)}</div></div><div class="text">${esc(x.note)}</div></div>`).join("");
let photo=photoData?`<img class="cv-photo" src="${photoData}" style="display:block">`:`<div class="cv-photo placeholder">FOTO<br>PROFIL</div>`;
$("paper").innerHTML=`<div class="cv-header">${photo}<div class="cv-head-info"><div class="name">${esc($("name").value)||"NAMA LENGKAP"}</div><div class="headline">${esc($("headline").value)||""}</div><div class="contact">${esc($("phone").value)}${$("phone").value?" | ":"}${esc($("city").value)}${$("city").value?" | ":"}<span class="email">${esc($("email").value)}</span></div></div></div>
<div class="sec"><div class="title">RINGKASAN PROFESIONAL</div><div class="text">${esc($("summary").value)||"Belum ada ringkasan."}</div></div>
<div class="sec"><div class="title">PENGALAMAN KERJA</div>${j||'<div class="text">Belum ada pengalaman.</div>'}</div>
<div class="sec"><div class="title">PENDIDIKAN</div>${e||'<div class="text">Belum ada pendidikan.</div>'}</div>
<div class="sec"><div class="title">KEAHLIAN & KOMPETENSI</div>${skillHTML($("skills").value)||'<div class="text">Belum ada keahlian.</div>'}</div>`;
}
function payload(){return {name:$('name').value,headline:$('headline').value,city:$('city').value,phone:$('phone').value,email:$('email').value,summary:$('summary').value,skills:$('skills').value,jobs,education,photoData}}
function saveDraft(){try{localStorage.setItem('cvIphone',JSON.stringify(payload()));$('status').textContent='Draft tersimpan di iPhone.'}catch(e){$('status').textContent='Draft gagal disimpan: foto terlalu besar. Pilih foto lain.'}}
function loadDraft(){let x=localStorage.getItem('cvIphone');if(!x){$('status').textContent='Belum ada draft.';return}try{let d=JSON.parse(x);['name','headline','city','phone','email','summary','skills'].forEach(k=>$(k).value=d[k]||'');jobs=d.jobs||[];education=d.education||[];photoData=d.photoData||'';if(photoData){$('photoPreview').src=photoData;$('photoPreview').style.display='block'}editors();render();$('status').textContent='Draft dimuat.'}catch(e){$('status').textContent='Draft tidak dapat dimuat.'}}
function generatePDF(){
  const status=$('status');
  render();
  status.textContent='Membuka menu PDF iPhone…';
  setTimeout(function(){
    try{
      window.print();
      setTimeout(function(){
        status.textContent='Di menu Print: buka preview dengan cubit/zoom, lalu Share → Save to Files.';
      },800);
    }catch(e){
      status.textContent='Menu PDF tidak dapat dibuka. Coba Safari lalu pilih Share → Print.';
    }
  },200);
}
$('photo').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Pilih file foto JPG/PNG.');return}const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.88);$('photoPreview').src=photoData;$('photoPreview').style.display='block';render()};img.src=r.result};r.readAsDataURL(f)});
document.querySelectorAll('input:not([type=file]),textarea').forEach(x=>x.addEventListener('input',render));
addJob();addEdu();render();
</script>
</body></html>
